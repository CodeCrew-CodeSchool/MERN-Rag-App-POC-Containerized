services:
  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          # Docker periodically calls the backend’s health endpoint to make sure the server is still working.
          "fetch('http://localhost:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama:
    build:
      context: ./ollama
    env_file:
      - ./ollama/.env
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test:
        [
          "CMD-SHELL",
          # Docker checks that both the Ollama chat model and embedding model have been downloaded before considering the Ollama service healthy.
          "ollama show \"$${OLLAMA_MODEL}\" >/dev/null 2>&1 && ollama show \"$${OLLAMA_EMBEDDING_MODEL}\" >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 10s

volumes:
  ollama_data:
